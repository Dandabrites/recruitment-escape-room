<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 2: Resume Interpretation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: auto; }
    .hint { color: gray; font-size: 0.9em; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Challenge 2: Interpret a Tricky Resume</h1>
    <p>You’ve received a resume with vague descriptions. Can you identify the candidate’s qualifications?</p>
    <p><strong>Resume:</strong> "Led operational improvements in upstream projects, resulting in increased efficiency."</p>
    <p>What is the candidate’s area of expertise?</p>
    <select id="resumeAnswer">
      <option value="">Select an answer</option>
      <option value="upstream operations">Upstream Operations</option>
      <option value="downstream operations">Downstream Operations</option>
      <option value="finance">Finance</option>
    </select>
    <button onclick="validateResume()">Submit</button>
    <p id="feedback"></p>
    <a href="linkedin.html">Next Challenge</a>
  </div>

  <script>
    function validateResume() {
      const answer = document.getElementById('resumeAnswer').value;
      const feedback = document.getElementById('feedback');

      if (answer === "upstream operations") {
        feedback.textContent = "Correct! The candidate specializes in upstream operations.";
        feedback.className = "success";
      } else {
        feedback.textContent = "Incorrect. Try again!";
        feedback.className = "error";
      }
    }
  </script>
</body>
</html>
