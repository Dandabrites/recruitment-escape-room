<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 1: Boolean Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: auto; }
    .hint { color: gray; font-size: 0.9em; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Challenge 1: Solve a Boolean String</h1>
    <p>Your task is to find a Project Controls Engineer with experience in Primavera P6 and cost control. Construct a Boolean search string to find the right candidates.</p>
    <p class="hint">Hint: Use operators like AND, OR, and parentheses.</p>
    <textarea id="booleanInput" rows="4" style="width: 100%;"></textarea>
    <button onclick="validateBoolean()">Submit</button>
    <p id="feedback"></p>
    <a href="resume.html">Next Challenge</a>
    <a href="answers.html">View All Answers</a>
  </div>

  <script>
    function validateBoolean() {
      const input = document.getElementById('booleanInput').value.toLowerCase();
      const feedback = document.getElementById('feedback');

      // Required terms
      const requiredTerms = [
        /(primavera|p6)/i, // Matches "Primavera" or "P6"
        /("cost control"|"project controls")/i, // Matches "Cost Control" or "Project Controls"
        /engineer/i // Matches "Engineer"
      ];

      // Check if all required terms are present
      const isValid = requiredTerms.every((regex) => regex.test(input));

      if (isValid) {
        feedback.textContent = "Correct! You’ve solved the Boolean string.";
        feedback.className = "success";
      } else {
        feedback.textContent = "Incorrect. Make sure to include all required terms.";
        feedback.className = "error";
      }
    }
  </script>
</body>
</html>
